<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestão de Horários</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<section id="tela-login" class="login" hidden>
    <form id="form-login" class="login-card" novalidate>
        <div class="marca">
            <span class="marca-icone" aria-hidden="true">
                <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
            </span>
            <div>
                <strong>Gestão de Horários</strong>
                <small>Horários de aula de professores</small>
            </div>
        </div>
        <h1>Entrar</h1>
        <label class="campo">
            <span>Usuário</span>
            <input name="usuario" autocomplete="username" required>
        </label>
        <label class="campo">
            <span>Senha</span>
            <input name="senha" type="password" autocomplete="current-password" required>
        </label>
        <p id="erro-login" class="erro-login" role="alert"></p>
        <button class="btn btn-primario btn-bloco" type="submit">Entrar</button>
        <p class="dica">Autenticação por usuário e senha. A documentação da API está no <a href="swagger-ui.html" target="_blank" rel="noopener">Swagger</a>.</p>
    </form>
</section>

<div id="aplicacao" class="app" hidden>
    <header class="topo">
        <button id="menu-alternar" class="menu-alternar" type="button" aria-label="Abrir menu" aria-expanded="false">
            <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <a class="marca" href="#/inicio">
            <span class="marca-icone" aria-hidden="true">
                <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
            </span>
            <strong>Gestão de Horários</strong>
        </a>
        <div class="usuario">
            <span id="usuario-nome" class="usuario-nome"></span>
            <span id="usuario-perfil" class="selo"></span>
            <button id="sair" class="btn btn-fantasma" type="button">Sair</button>
        </div>
    </header>

    <nav id="menu" class="menu" aria-label="Menu principal">
        <a href="#/inicio" data-rota="inicio">Início</a>
        <span class="menu-titulo">Cadastros</span>
        <a href="#/professores" data-rota="professores">Professores</a>
        <a href="#/disciplinas" data-rota="disciplinas">Disciplinas</a>
        <a href="#/turmas" data-rota="turmas">Turmas</a>
        <a href="#/horarios" data-rota="horarios">Horários</a>
        <span class="menu-titulo">Consultas</span>
        <a href="#/agenda/professor" data-rota="agenda/professor">Horários por professor</a>
        <a href="#/agenda/turma" data-rota="agenda/turma">Horários por turma</a>
        <span class="menu-titulo">API</span>
        <a href="swagger-ui.html" target="_blank" rel="noopener">Documentação Swagger</a>
    </nav>

    <main id="conteudo" class="conteudo" tabindex="-1"></main>
</div>

<div id="avisos" class="avisos" aria-live="polite"></div>

<dialog id="dialogo-confirmacao" class="dialogo">
    <form method="dialog">
        <h2 id="dialogo-titulo"></h2>
        <p id="dialogo-mensagem"></p>
        <div class="acoes">
            <button class="btn" value="cancelar">Cancelar</button>
            <button class="btn btn-perigo" value="confirmar">Excluir</button>
        </div>
    </form>
</dialog>

<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/crud.js"></script>
<script src="js/agenda.js"></script>
<script src="js/app.js"></script>
</body>
</html>
