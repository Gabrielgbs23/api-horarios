spring.application.name=api-horarios
server.port=${PORT:8080}

spring.datasource.url=jdbc:h2:file:./data/horarios-db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.persist-authorization=true

app.seguranca.admin.usuario=${ADMIN_USUARIO:admin}
app.seguranca.admin.senha=${ADMIN_SENHA:admin123}
app.seguranca.consulta.usuario=${CONSULTA_USUARIO:consulta}
app.seguranca.consulta.senha=${CONSULTA_SENHA:consulta123}
app.dados-exemplo=true
